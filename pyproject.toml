[project]
name = "resq-ai"
version = "0.1.0"
description = "ResQ-AI: classical-AI rescue simulator (BCSE306L)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "httpx2>=0.1",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/resq", "api"]

[tool.pytest.ini_options]
testpaths = ["tests/engine", "tests/api"]
addopts = "--cov=resq --cov-report=term-missing:skip-covered --cov-fail-under=90"

[tool.ruff]
line-length = 100
src = [".", "engine"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["×", "−"]  # used on purpose in priority breakdowns

[tool.mypy]
files = ["engine", "api", "tests", "scripts"]
strict = true
mypy_path = "engine"
explicit_package_bases = true
